<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BunkBy | Zimbabwe's Agent-Free Accommodation Marketplace</title>
    <meta name="description" content="Zimbabwe's premier agent-free accommodation marketplace. Find verified rooms, cottages, apartments, guesthouses, and lodges across Harare, Bulawayo, and beyond with direct WhatsApp contact and zero middleman fees." />
    <meta name="keywords" content="accommodation Zimbabwe, rooms for rent Harare, cottages Harare, agent-free rentals Zimbabwe, student accommodation Bulawayo, lodges Zimbabwe, BunkBy, direct landlord contact" />
    <meta name="author" content="BunkBy" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://bunkby.com/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/bunkby-logo.svg" />
    <link rel="apple-touch-icon" href="/bunkby-logo.svg" />

    <!-- OpenGraph Metadata for Facebook, WhatsApp, LinkedIn, Meta Crawlers -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BunkBy" />
    <meta property="og:url" content="https://bunkby.com/" />
    <meta property="og:title" content="BunkBy | Zimbabwe's Agent-Free Accommodation Marketplace" />
    <meta property="og:description" content="Browse verified rooms, cottages, apartments, and lodges across Zimbabwe. 100% free direct landlord and host contact with zero agency cuts." />
    <meta property="og:image" content="https://bunkby.com/bunkby-logo.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_ZW" />

    <!-- Twitter / X Cards for Social Sharing & Microsoft Crawlers -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BunkBy | Zimbabwe's Agent-Free Accommodation Marketplace" />
    <meta name="twitter:description" content="Find verified rooms, cottages, and lodges across Zimbabwe with direct WhatsApp connection and zero agent fees." />
    <meta name="twitter:image" content="https://bunkby.com/bunkby-logo.svg" />

    <!-- Schema.org JSON-LD Structured Data for Google, Gemini, and Microsoft AI -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BunkBy",
      "url": "https://bunkby.com/",
      "description": "Zimbabwe's agent-free accommodation marketplace connecting tenants directly with landlords and hosts.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bunkby.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "BunkBy Zimbabwe",
      "url": "https://bunkby.com/",
      "logo": "https://bunkby.com/bunkby-logo.svg",
      "description": "Agent-free rental accommodation platform across Harare, Bulawayo, Mutare, Gweru, and all Zimbabwe cities.",
      "areaServed": {
        "@type": "Country",
        "name": "Zimbabwe"
      },
      "priceRange": "$"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
